{% if new_password %}
<div class="notice ok" role="status">
  <p class="mb-0">Senha temporária de <strong>{{ new_password[0] }}</strong>. Ela aparece só esta vez — envie por um canal seguro e peça para trocar no primeiro acesso.</p>
  <div class="row mt-2"><span class="secret" id="newpass">{{ new_password[1] }}</span><button class="btn small ghost" type="button" data-copy="newpass">Copiar</button></div>
</div>
{% endif %}
{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
