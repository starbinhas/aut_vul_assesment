# Alvos vulneráveis de laboratório. ÚNICOS alvos permitidos em testes locais.
#   docker compose -f docker-compose.yml -f docker-compose.lab.yml up -d
# Ficam na rede `lab` (sem internet), compartilhada só com o ZAP e o worker-validate.

services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    networks: [lab]

  dvwa:
    image: vulnerables/web-dvwa:latest
    networks: [lab]

  zap:
    networks: [internal, egress, lab]

  worker-validate:
    networks: [internal, egress, lab]

  # No laboratório só existe a etapa 4 (o nuclei é da etapa 3, de outro colega):
  # o relatório não espera por ele.
  worker-report:
    environment:
      REPORT_REQUIRED_TOOLS: '["zap"]'

  # Testes de integração: rodam dentro da rede para alcançar os alvos e o ZAP.
  tests:
    build:
      context: .
      target: test
    env_file: .env
    environment:
      LAB_JUICE_SHOP_URL: http://juice-shop:3000
      LAB_DVWA_URL: http://dvwa
      ZAP_API_URL: http://zap:8080
    command: ["pytest", "-m", "integration"]
    networks: [internal, lab]
    profiles: [test]
    depends_on:
      zap: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

networks:
  lab:
    internal: true
