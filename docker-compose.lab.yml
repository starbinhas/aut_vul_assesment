# Alvos vulneráveis de laboratório. ÚNICOS alvos permitidos em testes locais.
#   docker compose -f docker-compose.yml -f docker-compose.lab.yml up -d
# Ficam na rede `lab` (sem internet), compartilhada só com o ZAP e o worker-validate.

services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    # O Juice Shop cai (segfault, exit 139) sob carga de scan. Com restart, ele volta sozinho e
    # o worker retoma a busca de onde parou (prontidão + espera de recuperação da etapa 4).
    restart: unless-stopped
    networks: [lab]

  dvwa:
    image: vulnerables/web-dvwa:latest
    restart: unless-stopped
    networks: [lab]

  zap:
    networks: [internal, egress, lab]

  worker-validate:
    networks: [internal, egress, lab]

  # Etapas 2 e 3 (naabu/nuclei) também alcançam os alvos de laboratório.
  worker-recon:
    networks: [internal, egress, lab]

  worker-cve:
    networks: [internal, egress, lab]

  # Agora o laboratório roda etapas 3 (nuclei) e 4 (ZAP): o relatório espera os dois.
  worker-report:
    environment:
      REPORT_REQUIRED_TOOLS: '["zap", "nuclei"]'

  # Testes de integração: rodam dentro da rede para alcançar os alvos e o ZAP.
  tests:
    build:
      context: .
      target: test
    env_file: .env
    environment:
      LAB_JUICE_SHOP_URL: http://juice-shop:3000
      LAB_DVWA_URL: http://dvwa
      ZAP_API_URL: http://zap:8080
    command: ["pytest", "-m", "integration"]
    networks: [internal, lab]
    profiles: [test]
    depends_on:
      zap: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

networks:
  lab:
    internal: true
