[project]
name = "scanner"
version = "0.1.0"
description = "Etapas 4 (web/ZAP), 5 (validação) e 6 (relatório + LLM) do scanner de segurança"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1.11",
    "alembic>=1.14",
    "httpx>=0.28",
    "jinja2>=3.1",
    "jsonschema>=4.23",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "sqlalchemy>=2.0",
    "weasyprint>=63",
    "zaproxy>=0.4",
    "fastapi>=0.142.2",
    "uvicorn>=0.32",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
    "argon2-cffi>=25.1.0",
    "dnspython>=2.8.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.14",
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanner"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]  # assert é permitido em testes

[tool.ruff.lint.flake8-bugbear]
# Padrão do FastAPI: dependências e campos de formulário são declarados no default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"scanner/report/catalog.py" = ["E501"]  # textos para o cliente
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
packages = ["scanner"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["zapv2.*", "weasyprint.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: roda contra os alvos de docker-compose.lab.yml (nunca contra sites reais)",
]
addopts = "-m 'not integration'"
